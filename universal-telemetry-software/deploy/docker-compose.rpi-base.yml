# Raspberry Pi base station — no laptop needed.
# Any device on the Pi's Wi-Fi hotspot opens PECAN in a browser, view-only.
# Set this up with setup-rpi-base.sh; see RPI_BASE_DEPLOY.md.
#
# Keeps a raw CSV of what reached it over the radio. The car's recorder is the
# complete record, and TimescaleDB is only on the laptop stacks.
#
# Usage:
#   docker compose -f deploy/docker-compose.rpi-base.yml up -d
#
# Access points:
#   Pecan dashboard: http://192.168.20.1 or http://pecan.wfr (from the hotspot)

services:
  telemetry:
    image: ghcr.io/western-formula-racing/data-acquisition/universal-telemetry:latest
    container_name: daq-telemetry
    privileged: true
    network_mode: host
    restart: unless-stopped
    environment:
      - ROLE=base
      - REMOTE_IP=${REMOTE_IP:-10.71.1.10}
      - UDP_PORT=5005
      - TCP_PORT=5006
      - REDIS_URL=redis://127.0.0.1:6379/0
      - WS_PORT=9080
      - STATUS_PORT=8080
      - SIMULATE=false
      - ENABLE_VIDEO=false
      - ENABLE_AUDIO=false
      - SET_TIME_ENABLED=false
      - CAR_TIME_PUSH_REQUIRES_SYNC=true
      # The radio's passive 24 V comes from our PoE board, which this enables.
      # On a Pi without the board, set OFF_THE_SHELF=true in deploy/.env.
      - OFF_THE_SHELF=${OFF_THE_SHELF:-false}
      - ENABLE_TIMESCALE_LOGGING=false
      # CAN writes stay off: anyone on the hotspot can reach this telemetry server.
      - ENABLE_UPLINK=false
      - ENABLE_TX_WS=false
      - DBC_FILE_PATH=/app/dbc_uploads/active.dbc
      - DBC_UPLOAD_PATH=/app/dbc_uploads/active.dbc
    volumes:
      - /lib/modules:/lib/modules
      - ${WFR_DBC_DIR:-./dbc}:/app/dbc_uploads
      - raw_can_data:/app/raw_can_logs
    # No fallback copy into dbc_uploads: PECAN warns viewers when active.dbc is missing.
    command: sh -c '[ -s /app/dbc_uploads/active.dbc ] || export DBC_FILE_PATH=/app/example.dbc; exec python main.py'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:8.2
    container_name: daq-redis
    restart: unless-stopped
    ports:
      # Has no password, so it must not be reachable from the hotspot.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  pecan:
    image: ghcr.io/western-formula-racing/data-acquisition/pecan:latest
    container_name: daq-pecan
    # Host networking keeps every service behind one firewall. Docker's published
    # ports would skip the INPUT rules in wfr-hotspot-firewall.nft.
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./base-station.json:/usr/share/nginx/html/base-station.json:ro
      - ${WFR_DBC_DIR:-./dbc}:/usr/share/nginx/html/dbc:ro
    depends_on:
      - telemetry

  # Optional TLS terminator for HTTPS pages: wss://<pi-ip>:9443 → ws://localhost:9080.
  # The hotspot firewall blocks 9443, so this is only for other networks.
  caddy:
    image: caddy:alpine
    container_name: daq-caddy
    profiles:
      - tls
    network_mode: host
    restart: unless-stopped
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  raw_can_data:
  redis_data:
  caddy_data:
