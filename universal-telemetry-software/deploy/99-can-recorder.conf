# Limits how much unwritten data other processes can queue ahead of the CAN
# recorder. Measured on the car's Pi 5 (16 GB RAM) with its SD card, during a
# 200 MiB burst from another process:
#   default (dirty_ratio=20, about 3 GB allowed): recorder commit stalled 3.6 s
#   these settings:                               recorder commit stalled 0.54 s
# 16 MiB was tried too and made ordinary commits slower with no gain.
#
# Install: sudo cp deploy/99-can-recorder.conf /etc/sysctl.d/ && sudo sysctl --system
vm.dirty_bytes = 67108864
vm.dirty_background_bytes = 16777216
