server {
    listen 80;
    # A base station runs this container on the host network, so port 3000 can't be
    # mapped there, and older docs and QR cards still point at it.
    listen 3000;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Only exists on a base station, which mounts it. It must return 404 elsewhere
    # rather than fall through to index.html below.
    location = /base-station.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # The DBC a base station gives every device. A replaced file should apply on reload.
    location /dbc/ {
        default_type text/plain;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Main location block - serve static files and SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
